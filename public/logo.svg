  </g>
</g>
  <text x="112" y="74" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5"><tspan fill="#1E3A8A">Agile</tspan><tspan fill="#14B8A6">Metrix</tspan></text>
</svg>
